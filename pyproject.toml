[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-claim-audit"
version = "0.1.0"
description = "Offline static audit of live HTTP push-channel documentation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
sse-claim-audit = "sse_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["sse_claim_audit*"]
